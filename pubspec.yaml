name: symmetry
description: "Symmetry AI Gym Workout Log application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  go_router: ^18.0.2
  get_it: ^9.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  intl: ^0.20.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.15.0
  drift_dev: ^2.35.1

dependency_overrides:
  build_config: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/
    - assets/icons/navigation_bar/
    - assets/icons/navigation_bar/redesign/
    - assets/icons/streak/
    - assets/icons/ranking/
    - assets/icons/ranking/base/
    - assets/icons/ranking/tiered/
    - assets/icons/ranking/muscle_drawer/
    - assets/icons/library/
    - assets/icons/workout_plan_management/
    - assets/workout_plan_templates/
    - assets/data/
    - assets/quick_workouts/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-Black.ttf
          weight: 900
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlbertSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlbertSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlbertSans-ExtraBold.ttf
          weight: 800
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 300
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
